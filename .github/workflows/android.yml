name: Build Android APK

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Gradle 8.2.1 / AGP 8.2.1 do not support JDK 21 — 8.5 was the first to.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets and sync native project
        run: |
          npm run build
          npx cap sync android

      # Without the secret we still build, just unsigned. That keeps the whole
      # toolchain exercised on every push; only the install-on-phone step needs a key.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — building an UNSIGNED APK, which Android will refuse to install. Add the secret to get an installable build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quiet-time.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ARGS=()
          if [ "$SIGNED" = "true" ]; then
            ARGS+=("-PQT_KEYSTORE_FILE=$RUNNER_TEMP/quiet-time.jks")
            ARGS+=("-PQT_KEYSTORE_PASSWORD=$STORE_PASSWORD")
            ARGS+=("-PQT_KEY_ALIAS=quiet-time")
            ARGS+=("-PQT_KEY_PASSWORD=$KEY_PASSWORD")
          fi
          ./gradlew assembleRelease --no-daemon "${ARGS[@]}"

      - name: Confirm the APK is actually signed
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Remove keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/quiet-time.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: quiet-time-${{ steps.keystore.outputs.signed == 'true' && 'signed' || 'UNSIGNED' }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
