name: Build Android APK

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Gradle 8.2.1 / AGP 8.2.1 do not support JDK 21 — 8.5 was the first to.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets and sync native project
        run: |
          npm run build
          npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot sign the APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quiet-time.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PQT_KEYSTORE_FILE="$RUNNER_TEMP/quiet-time.jks" \
            -PQT_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
            -PQT_KEY_ALIAS=quiet-time \
            -PQT_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Confirm the APK is actually signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Remove keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/quiet-time.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: quiet-time-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
